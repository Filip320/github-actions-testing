name: Test Runner Memory

on:
  workflow_dispatch:

jobs:
  check-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Check RAM allocation
        run: |
          echo "=== Summary of Runner Memory ==="
          free -h
          echo ""
          echo "=== Detailed System Memory Info ==="
          cat /proc/meminfo | grep -E "MemTotal|MemFree|MemAvailable"
